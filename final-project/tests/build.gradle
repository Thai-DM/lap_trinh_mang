apply plugin: "java"

sourceCompatibility = 17
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'



sourceSets {
    test {
        java {
            srcDir 'src'
        }
        resources {
            srcDir '../assets'
        }
    }
}

dependencies {
    testImplementation project(':server') // Real-server client interoperability tests only.
    testImplementation files(project(':server').sourceSets.test.output)
    implementation 'junit:junit:4.13.1'
    testImplementation 'com.badlogicgames.gdx:gdx-backend-headless:1.11.0'

}

eclipse.project {
    name = appName + "-tests"
}

// Manual desktop smoke helper; LAN binding requires an explicit -PbindHost.
tasks.register('runLocalServer', JavaExec) {
    dependsOn testClasses
    mainClass = 'com.smashprofs.tests.tools.LocalGameServer'
    classpath = sourceSets.test.runtimeClasspath
    args((project.findProperty('port') ?: '54555').toString(),
            (project.findProperty('bindHost') ?: '127.0.0.1').toString())
    standardInput = System.in
}
