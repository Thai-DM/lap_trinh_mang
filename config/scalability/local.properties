# Local prototype only. Credentials arrive through SMASHPROFS_CLUSTER_SECRET.
http.port=8080
region=local
workers.initial=3
workers.min=3
workers.max=6
autoscaling.enabled=false
allocation.algorithm=LOAD_AWARE
allocation.weights=.20,.25,.20,.10,.15,.10
worker.tcp.base=9000
worker.admin.base=9100
worker.heap=512m
max.rooms=256
max.connections=1024
snapshot.mode=BASELINE
snapshot.hz=20
snapshot.min.hz=5
run.dir=build/scalability/workers
history.dir=build/scalability/history
shutdown.grace.seconds=10
